name: Verify Real-time Cross-App Sync

on:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run real-time sync verification
        run: node scripts/verify-realtime-sync.mjs
