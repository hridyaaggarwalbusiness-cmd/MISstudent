name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install student-app dependencies
        working-directory: student-app
        run: npm ci

      - name: Export student-app web build
        working-directory: student-app
        env:
          # Baked into the static web bundle at build time - the AI Practice
          # Test Generator calls Gemini directly from the browser (see
          # student-app/src/services/ai/geminiProvider.ts) since Cloud
          # Functions need the Blaze plan. Restrict this key by HTTP
          # referrer in Google Cloud Console to this app's real domains.
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx expo export --platform web --output-dir dist

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Build admin-app
        working-directory: admin-app
        run: npm run build

      - name: Install teacher-app dependencies
        working-directory: teacher-app
        run: npm ci

      - name: Export teacher-app web build
        working-directory: teacher-app
        run: npx expo export --platform web --output-dir dist

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Ensure admin Hosting site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:create mis-student-admin --project mis-student-6yhtxk --token "$FIREBASE_TOKEN" || true

      - name: Ensure teacher Hosting site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:create mis-student-teacher --project mis-student-6yhtxk --token "$FIREBASE_TOKEN" || true

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project mis-student-6yhtxk --token "$FIREBASE_TOKEN"
