name: Deploy to Firebase Hosting

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install student-app dependencies
        working-directory: student-app
        run: npm ci

      - name: Export student-app web build
        working-directory: student-app
        env:
          # Baked into the static web bundle at build time - the AI Practice
          # Test Generator calls Gemini directly from the browser (see
          # student-app/src/services/ai/geminiProvider.ts) since Cloud
          # Functions need the Blaze plan. Restrict this key by HTTP
          # referrer in Google Cloud Console to this app's real domains.
          # Dedicated to this app - see NOTICE_GEMINI_API_KEY below for why
          # admin-app's Notice Writer no longer shares this same quota.
          EXPO_PUBLIC_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Optional: a comma-separated list of additional free-tier Gemini
          # API keys (from separate Google Cloud projects, each with its own
          # independent free quota). geminiProvider.ts rotates through
          # GEMINI_API_KEY first, then each of these in order, whenever a
          # key's quota is exhausted - multiplying the effective daily
          # request budget without needing to enable billing. Safe to leave
          # unset; the app still works on the single GEMINI_API_KEY alone.
          EXPO_PUBLIC_GEMINI_API_KEYS_EXTRA: ${{ secrets.GEMINI_API_KEYS_EXTRA }}
        run: npx expo export --platform web --output-dir dist

      - name: Install admin-app dependencies
        working-directory: admin-app
        run: npm ci

      - name: Build admin-app
        working-directory: admin-app
        env:
          # Baked into the static web bundle at build time - the AI Notice
          # Writer calls Gemini directly from the browser (see
          # admin-app/src/services/ai/geminiProvider.ts), same reasoning as
          # student-app's EXPO_PUBLIC_GEMINI_API_KEY above. Uses its OWN key
          # (NOTICE_GEMINI_API_KEY) so Notice Writer usage doesn't share a
          # free-tier quota bucket with the student-app's AI Practice Test
          # Generator - falls back to the shared GEMINI_API_KEY if the
          # dedicated secret hasn't been added yet, so this never breaks the
          # build. Make sure this app's Hosting domain is on whichever key's
          # HTTP-referrer allowlist in Google Cloud Console.
          VITE_GEMINI_API_KEY: ${{ secrets.NOTICE_GEMINI_API_KEY || secrets.GEMINI_API_KEY }}
          # Optional: comma-separated additional free-tier Gemini keys for
          # this app's own rotation pool - same mechanism as student-app's
          # EXPO_PUBLIC_GEMINI_API_KEYS_EXTRA above, kept as a separate
          # secret so Notice Writer's key pool doesn't overlap with the
          # Practice Test Generator's.
          VITE_GEMINI_API_KEYS_EXTRA: ${{ secrets.NOTICE_GEMINI_API_KEYS_EXTRA }}
        run: npm run build

      - name: Install teacher-app dependencies
        working-directory: teacher-app
        run: npm ci

      - name: Export teacher-app web build
        working-directory: teacher-app
        run: npx expo export --platform web --output-dir dist

      - name: Install driver-app dependencies
        working-directory: driver-app
        run: npm ci

      - name: Export driver-app web build
        working-directory: driver-app
        run: npx expo export --platform web --output-dir dist

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Ensure admin Hosting site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:create mis-student-admin --project mis-student-6yhtxk --token "$FIREBASE_TOKEN" || true

      - name: Ensure teacher Hosting site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:create mis-student-teacher --project mis-student-6yhtxk --token "$FIREBASE_TOKEN" || true

      - name: Ensure driver Hosting site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase hosting:sites:create mis-student-driver --project mis-student-6yhtxk --token "$FIREBASE_TOKEN" || true

      - name: Deploy to Firebase Hosting
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only hosting --project mis-student-6yhtxk --token "$FIREBASE_TOKEN"
