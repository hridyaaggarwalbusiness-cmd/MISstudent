name: Deploy Firestore, Realtime Database & Storage Rules

on:
  workflow_dispatch:

jobs:
  deploy-rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Deploy Firestore rules and indexes
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: firebase deploy --only firestore:rules,firestore:indexes --project mis-student-6yhtxk --token "$FIREBASE_TOKEN"

      - name: Deploy Realtime Database rules
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        # Tolerates failure until Realtime Database is enabled once in the
        # Firebase Console (Build > Realtime Database > Create Database) -
        # deploying database rules to a project with no RTDB instance yet
        # errors out, so this step doesn't block the Firestore rules above.
        run: firebase deploy --only database --project mis-student-6yhtxk --token "$FIREBASE_TOKEN" || echo "Realtime Database rules not deployed - enable Realtime Database in the Firebase Console first, then re-run this workflow."
